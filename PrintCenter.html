<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintCenter Pro | Gerenciamento de Impressoras</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg-base: #0a0f16;
            --bg-surface: #111923;
            --bg-card: #182230;
            --bg-hover: #1f2d3d;
            --bg-input: #141e2b;
            --border: #263240;
            --border-light: #304050;
            --text-primary: #e8edf4;
            --text-secondary: #a0b4c8;
            --text-muted: #6b8098;
            --accent: #3b8beb;
            --accent-glow: rgba(59, 139, 235, 0.25);
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.1);
            --yellow: #eab308;
            --yellow-bg: rgba(234, 179, 8, 0.1);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.1);
            --purple: #a855f7;
            --purple-bg: rgba(168, 85, 247, 0.12);
            --radius: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        /* SIDEBAR */
        .sidebar {
            width: 268px;
            min-width: 268px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: var(--shadow-card);
        }
        .sidebar-brand {
            padding: 22px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .sidebar-brand .brand-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .sidebar-brand .brand-text small {
            font-weight: 400;
            font-size: 0.68rem;
            color: var(--text-muted);
            display: block;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .sidebar-nav {
            flex: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
        }
        .sidebar-nav .nav-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 14px 12px 6px;
            font-weight: 700;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 14px;
            border-radius: var(--radius);
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.88rem;
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
        }
        .sidebar-nav a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .sidebar-nav a.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .sidebar-nav a i {
            width: 18px;
            text-align: center;
            font-size: 0.95rem;
        }
        .sidebar-nav a .badge {
            margin-left: auto;
            background: var(--red);
            color: #fff;
            font-size: 0.65rem;
            padding: 3px 9px;
            border-radius: 20px;
            font-weight: 700;
        }
        .sidebar-footer {
            padding: 14px;
            border-top: 1px solid var(--border);
        }
        .btn-agent {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px 14px;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.02em;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
        }
        .btn-agent:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.45);
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .topbar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 64px;
        }
        .topbar .page-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .search-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 9px 16px;
            gap: 10px;
            flex: 0 1 400px;
            transition: all var(--transition);
        }
        .search-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .search-wrap input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.88rem;
            outline: none;
            width: 100%;
        }
        .search-wrap input::placeholder {
            color: var(--text-muted);
        }
        .search-wrap i {
            color: var(--text-muted);
        }
        .topbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn {
            width: 37px;
            height: 37px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.9rem;
        }
        .icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .avatar-sm {
            width: 37px;
            height: 37px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
            cursor: pointer;
        }

        /* CONTENT */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 22px 26px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .content::-webkit-scrollbar {
            width: 5px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow-card);
        }
        .stat-card:hover {
            border-color: var(--border-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .stat-icon.blue {
            background: rgba(59, 139, 235, 0.12);
            color: var(--accent);
        }
        .stat-icon.green {
            background: var(--green-bg);
            color: var(--green);
        }
        .stat-icon.yellow {
            background: var(--yellow-bg);
            color: var(--yellow);
        }
        .stat-icon.purple {
            background: var(--purple-bg);
            color: var(--purple);
        }
        .stat-info .val {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1;
        }
        .stat-info .lbl {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-header h3 {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        .btn {
            padding: 8px 16px;
            border-radius: 22px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .btn-primary:hover {
            background: #4d95f0;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.72rem;
            border-radius: 18px;
        }
        .btn-icon-text {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 6px;
            transition: all var(--transition);
        }
        .btn-icon-text:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .btn-danger-text {
            color: var(--red);
        }
        .btn-danger-text:hover {
            background: var(--red-bg);
        }

        .filter-pills {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            border-radius: 24px;
            padding: 4px;
        }
        .filter-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .filter-pill.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 6px var(--accent-glow);
        }

        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.83rem;
        }
        table thead th {
            background: var(--bg-surface);
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        table tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            white-space: nowrap;
            vertical-align: middle;
        }
        table tbody tr {
            transition: background var(--transition);
            cursor: pointer;
        }
        table tbody tr:hover {
            background: var(--bg-hover);
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .dot.online {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }
        .dot.offline {
            background: var(--red);
            box-shadow: 0 0 6px var(--red);
        }
        .dot.warning {
            background: var(--yellow);
            box-shadow: 0 0 6px var(--yellow);
        }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .tag-green {
            background: var(--green-bg);
            color: var(--green);
        }
        .tag-red {
            background: var(--red-bg);
            color: var(--red);
        }
        .tag-yellow {
            background: var(--yellow-bg);
            color: var(--yellow);
        }
        .tag-purple {
            background: var(--purple-bg);
            color: var(--purple);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            width: 92%;
            max-width: 780px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: translateY(18px);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal {
            transform: translateY(0);
        }
        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 5;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }
        .modal-header h2 {
            font-weight: 700;
            font-size: 1rem;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg-hover);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: var(--red-bg);
            color: var(--red);
        }
        .modal-body {
            padding: 20px 22px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .detail-item {
            background: var(--bg-surface);
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .detail-item .lbl {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 600;
        }
        .detail-item .val {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .chart-box {
            margin-top: 16px;
            background: var(--bg-surface);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            height: 250px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 13px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: all var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 13px 22px;
            border-radius: 28px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 9999;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 1100px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 64px;
                min-width: 64px;
            }
            .sidebar .brand-text,
            .sidebar-nav a span,
            .sidebar-nav .nav-label,
            .sidebar-footer .btn-agent span,
            .sidebar-nav a .badge {
                display: none;
            }
            .sidebar-nav a {
                justify-content: center;
                padding: 12px;
            }
            .sidebar-brand {
                justify-content: center;
            }
            .content {
                padding: 12px;
            }
            .topbar {
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fas fa-print"></i></div>
            <div class="brand-text">PrintCenter<small>Pro</small></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Principal</div>
            <a class="active" data-page="dashboard" onclick="goTo('dashboard')"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
            <a data-page="clients" onclick="goTo('clients')"><i class="fas fa-building"></i> <span>Clientes</span></a>
            <a data-page="printers" onclick="goTo('printers')"><i class="fas fa-print"></i> <span>Impressoras</span> <span class="badge" id="badgePrinters">8</span></a>
            <a data-page="parque" onclick="goTo('parque')"><i class="fas fa-server"></i> <span>Parque Geral</span></a>
            <div class="nav-label">Monitoramento</div>
            <a data-page="alerts" onclick="goTo('alerts')"><i class="fas fa-bell"></i> <span>Alertas</span> <span class="badge" id="badgeAlerts">2</span></a>
            <a data-page="reports" onclick="goTo('reports')"><i class="fas fa-chart-bar"></i> <span>Relatórios</span></a>
            <a data-page="settings" onclick="goTo('settings')"><i class="fas fa-cog"></i> <span>Configurações</span></a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-agent" onclick="downloadAgent()"><i class="fas fa-download"></i> <span>Baixar Agente Geral</span></button>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
        <header class="topbar">
            <div class="page-title" id="pageTitle">📊 Dashboard</div>
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearch" placeholder="Buscar impressoras, clientes, IP..." oninput="handleSearch()">
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" title="Notificações" onclick="goTo('alerts')"><i class="fas fa-bell"></i></button>
                <button class="icon-btn" title="Atualizar dados" onclick="refreshData()"><i class="fas fa-sync-alt"></i></button>
                <div class="avatar-sm">AD</div>
            </div>
        </header>
        <div class="content" id="contentArea"></div>
    </div>

    <!-- MODAL IMPRESSORA -->
    <div class="modal-overlay" id="modalPrinter">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalPrinterTitle">🖨️ Detalhes da Impressora</h2>
                <button class="modal-close" onclick="closeModal('modalPrinter')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalPrinterBody"></div>
        </div>
    </div>

    <!-- MODAL CLIENTE -->
    <div class="modal-overlay" id="modalClient">
        <div class="modal" style="max-width:580px;">
            <div class="modal-header">
                <h2 id="modalClientTitle">👤 Novo Cliente</h2>
                <button class="modal-close" onclick="closeModal('modalClient')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="clientForm" onsubmit="saveClient(event)">
                    <input type="hidden" id="clientId">
                    <div class="form-grid">
                        <div class="form-group"><label>Nome *</label><input type="text" id="clientName" required placeholder="Empresa ABC"></div>
                        <div class="form-group"><label>CNPJ/CPF</label><input type="text" id="clientDoc" placeholder="00.000.000/0000-00"></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>E-mail</label><input type="email" id="clientEmail" placeholder="email@empresa.com"></div>
                        <div class="form-group"><label>Telefone</label><input type="text" id="clientPhone" placeholder="(11) 99999-9999"></div>
                    </div>
                    <div class="form-group"><label>Endereço</label><input type="text" id="clientAddress" placeholder="Rua, número, bairro, cidade - UF"></div>

                    area.innerHTML = renderAlertsPage();

        // ==================== DETALHE CLIENTE ====================

        function renderClientChart(clientId) {
            const cp = printers.filter(p => p.clientId === clientId);
            const agg = new Array(14).fill(0);
            cp.forEach(p => p.history.forEach((v, i) => { if (i < 14) agg[i] += v; }));
            setTimeout(() => {
                const ctx = document.getElementById('clientChart');
                if (ctx) {
                    if (window._clientChart) window._clientChart.destroy();
                    window._clientChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['13/06', '14/06', '15/06', '16/06', '17/06', '18/06', '19/06', '20/06',
                                '21/06', '22/06', '23/06', '24/06', '25/06', '26/06'

                            datasets: [{ label: 'Páginas', data: agg,
                                backgroundColor: 'rgba(99,102,241,0.55)', borderColor: '#818cf8',
                                borderWidth: 2, borderRadius: 6 }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { labels: { color: '#a0b4c8' } } },
                            scales: {
                                x: { ticks: { color: '#6b8098' }, grid: { color: '#263240' } },
                                y: { ticks: { color: '#6b8098' }, grid: { color: '#263240' },
                                    beginAtZero: true }
                            }
                        }
                    });
                }
            }, 250);

        function downloadClientAgent(clientId) {
            const client = clients.find(c => c.id === clientId);

            </div>`;

            let list = printers;

                                backgroundColor: 'rgba(59,139,235,0.55)', borderColor: '#3b8beb',
                                borderWidth: 2, borderRadius: 6 }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { labels: { color: '#a0b4c8' } } },
                            scales: { x: { ticks: { color: '#6b8098' }, grid: { color: '#263240' } },
                                y: { ticks: { color: '#6b8098' }, grid: { color: '#263240' },
                                beginAtZero: true } }
                        }
                    });
                }
            }, 300);
        }

        function openClientModal(id = null) {
            const title = document.getElementById('modalClientTitle');
            if (id) {
                const c = clients.find(cl => cl.id === id);
                if (c) {
                    title.textContent = '✏️ Editar Cliente';
                    document.getElementById('clientId').value = c.id;
                    document.getElementById('clientName').value = c.name;
                    document.getElementById('clientDoc').value = c.doc;
                    document.getElementById('clientEmail').value = c.email;
                    document.getElementById('clientPhone').value = c.phone;
                    document.getElementById('clientAddress').value = c.address;
                    document.getElementById('clientPlan').value = c.plan;
                }
            } else {
                title.textContent = '👤 Novo Cliente';
                document.getElementById('clientId').value = '';
                document.getElementById('clientForm').reset();
            }
            document.getElementById('modalClient').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if (window._histChart) { window._histChart.destroy();
                window._histChart = null; }
            if (window._clientChart) { window._clientChart.destroy();
                window._clientChart = null; }
        }

        function saveClient(event) {
            event.preventDefault();
            const id = document.getElementById('clientId').value;
            const data = {
                name: document.getElementById('clientName').value,
                doc: document.getElementById('clientDoc').value,
                email: document.getElementById('clientEmail').value,
                phone: document.getElementById('clientPhone').value,
                address: document.getElementById('clientAddress').value,
                plan: document.getElementById('clientPlan').value,
            };
            if (id) {
                const idx = clients.findIndex(c => c.id == id);
                if (idx >= 0) {
                    clients[idx] = { ...clients[idx], ...data };
                    printers.forEach(p => { if (p.clientId == id) p.clientName = data.name; });
                }
            } else {
                const newId = Math.max(...clients.map(c => c.id), 0) + 1;
                clients.push({ ...data, id: newId });
            }
            closeModal('modalClient');
            render();
            updateBadges();
            toast(id ? 'Cliente atualizado!' : 'Cliente criado com sucesso!');
        }

        function deleteClient(id) {
            if (!confirm('Excluir cliente e suas impressoras?')) return;
            clients.splice(clients.findIndex(c => c.id === id), 1);
            for (let i = printers.length - 1; i >= 0; i--) { if (printers[i].clientId === id) printers.splice(i, 1); }
            if (currentPage === 'client-detail' && currentClientId === id) goTo('clients');
            else render();
            updateBadges();
            toast('Cliente excluído.');
        }

        // ==================== HELPERS ====================
        function statusTag(s) {
            const map = {
                online: '<span class="tag tag-green"><span class="dot online"></span>Online</span>',
                offline: '<span class="tag tag-red"><span class="dot offline"></span>Offline</span>',
                warning: '<span class="tag tag-yellow"><span class="dot warning"></span>Atenção</span>'
            };
            return map[s] || s;
        }

        function planTag(p) {
            const map = {
                basic: '<span class="tag tag-yellow">Básico</span>',
                pro: '<span class="tag tag-green">Profissional</span>',
                enterprise: '<span class="tag tag-purple">Enterprise</span>'
            };
            return map[p] || p;
        }

        function tonerBar(level) {
            let color = 'var(--green)';
            if (level < 20) color = 'var(--red)';
            else if (level < 40) color = 'var(--yellow)';
            return `<div style="display:flex;align-items:center;gap:5px;"><div style="width:44px;height:5px;background:var(--bg-input);border-radius:6px;overflow:hidden;"><div style="width:${level}%;height:100%;background:${color};border-radius:6px;"></div></div>${level}%</div>`;
        }

        function handleSearch() {
            if (['printers', 'parque'].includes(currentPage)) {
                const wrap = document.getElementById('printersTableWrap');
                if (wrap) wrap.innerHTML = renderPrinterTable(currentFilter);
            } else if (currentPage === 'clients') {
                document.getElementById('contentArea').innerHTML = renderClientsPage();
            }
        }

        function refreshData() {
            toast('🔄 Dados atualizados!');
            render();
            updateBadges();
        }

        function downloadAgent() {
            toast('⬇️ Download do Agente Geral iniciado!');
        }

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 2400);
        }

        // Fechar modais ao clicar no overlay ou ESC
        document.addEventListener('click', e => {
            if (e.target.classList.contains('modal-overlay')) closeModal(e.target.id);
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => closeModal(m
                .id));
        });

        // Inicializar
        goTo('dashboard');
    </script>
</body>
</html>
